[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mvp"
version = "2.14.0"
description = "Corredor autónomo de optimización para VQCC: mutador, pipeline, fuerza bruta con reparto equilibrado, compensación global, Notebook de ganadores y aceleración nativa opcional"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Arturo Salvador Balderas Hernández"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["auto_mvp*"]
